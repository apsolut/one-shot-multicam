# Fly.io config for the public hosted judge demo (https://one-shot-multicam.fly.dev).
# Secret (set separately, never committed): fly secrets set COMFY_API_KEY=...
# Deploy: fly deploy --remote-only --ha=false
app = "one-shot-multicam"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  MULTICAM_HOST = "0.0.0.0"
  MULTICAM_DATA_DIR = "/data"          # job-cap ledger (hosted_jobs.json) + uploads live on the volume
  MULTICAM_PUBLIC = "1"
  MULTICAM_HOSTED_KEY_ENV = "COMFY_API_KEY"
  MULTICAM_HOSTED_ACCESS = "judge"     # bring-your-own-key for everyone; the hosted key only with the private judge code
  MULTICAM_JUDGE_MAX_JOBS = "10"       # total jobs the judge code may spend (secret MULTICAM_JUDGE_CODE, never committed)
  # more promo codes: secret MULTICAM_PROMO_CODES = "CODE:LIMIT,CODE:LIMIT" (per-code counters, hashed, in
  # /data/hosted_jobs.json "promo_jobs"; remove a code from the secret to revoke it). The floor below still applies.
  MULTICAM_MAX_JOBS = "0"              # no open free quota (free use = the trial runs below)
  MULTICAM_HOSTED_RUNS = "11"          # free trial runs on the hosted key, 1 per visitor; topped up 6 -> 11 on 2026-10-28 (used count: /data/hosted_jobs.json)
  MULTICAM_TRIAL_JOBS_PER_RUN = "10"   # Comfy jobs one free run may use
  MULTICAM_PROXY_HOPS = "1"            # Fly's edge proxy appends the client IP to X-Forwarded-For
  MULTICAM_HOSTED_FLOOR_USD = "24.65"  # hard stop: lowered 28.15 -> 24.65 on 2026-10-28 with the 11-run top-up (~$6.35 free budget above the floor at the $31.00 balance)

[mounts]
  source = "multicam_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/config"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
